name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the release archive
        shell: powershell
        run: .\build-release.ps1

      - name: Run the script test suite
        shell: powershell
        run: |
          $log = & powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\fix-discord-media.tests.ps1 2>&1 |
              ForEach-Object { $_.ToString() }
          $code = $LASTEXITCODE
          $log | Write-Host
          # The log of a private repository is not readable without a token, so a
          # red run puts its own output where anyone can see which check failed.
          if ($code -ne 0 -and $env:GITHUB_STEP_SUMMARY) {
              $body = "### The test suite failed" + "`n`n" + '```' + "`n" + ($log -join "`n") + "`n" + '```' + "`n"
              [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $body, (New-Object Text.UTF8Encoding($false)))
          }
          exit $code
